[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hi-canvas-api"
version = "0.1.0"
description = "Tools for importing, exporting and managing Canvas courses via the Canvas API."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "HI-IDN" }]
dependencies = [
    "requests",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/HI-IDN/canvas"
Repository = "https://github.com/HI-IDN/canvas"

[tool.setuptools]
packages = ["hi_canvas_api"]
